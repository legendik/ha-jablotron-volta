            name: Venkovní (Composite)
          - entity: sensor.jablotron_volta_boiler_water_input_temperature
            name: Voda - vstup
          - entity: sensor.jablotron_volta_ch1_water_setpoint
            name: CH1 Setpoint
  - title: Ekvitermní křivka
    path: ekviterm
    icon: mdi:chart-bell-curve
    cards:
      - type: markdown
        content: |
          ## 📊 Ekvitermní regulace

          **Jak to funguje:**
          - Kotel mění teplotu vody podle venkovní teploty
          - **Slope** = Jak moc se mění (sklon křivky)
          - **Offset** = Posun celé křivky nahoru/dolů
          - **Composite Ratio** = Mix aktuální + tlumené teploty (0.5 = 50/50)

          **Tvoje nastavení je optimalizované pro podlahové topení!**
      - type: entities
        title: ⚙️ Nastavení ekvitermní křivky
        show_header_toggle: false
        entities:
          - entity: number.jablotron_volta_ch1_equitherm_slope
            name: Sklon křivky (Slope)
            icon: mdi:angle-acute
          - entity: number.jablotron_volta_ch1_equitherm_offset
            name: Posun křivky (Offset)
            icon: mdi:arrow-up-down
          - entity: number.jablotron_volta_composite_filter_ratio
            name: Composite Filter Ratio
            icon: mdi:filter
      - type: entities
        title: 🌡️ Venkovní teploty
        show_header_toggle: false
        entities:
          - entity: sensor.jablotron_volta_outdoor_temperature_composite
            name: Composite (použito pro ekviterm)
            icon: mdi:thermometer
          - entity: sensor.jablotron_volta_outdoor_temperature_damped
            name: Tlumená
            icon: mdi:thermometer-lines
          - type: divider
          - entity: number.jablotron_volta_building_momentum
            name: Konstanta setrvačnosti budovy
            icon: mdi:timer-sand
      - type: gauge
        entity: sensor.jablotron_volta_ch1_water_setpoint
        name: Výsledná teplota vody (CH1)
        min: 20
        max: 60
        severity:
          green: 30
          yellow: 45
          red: 55
        needle: true
      - type: history-graph
        title: 📈 Ekvitermní regulace (48h)
        hours_to_show: 48
        refresh_interval: 300
        entities:
          - entity: sensor.jablotron_volta_outdoor_temperature_composite
            name: Venkovní (Composite)
          - entity: sensor.jablotron_volta_ch1_water_setpoint
            name: Teplota vody
          - entity: sensor.jablotron_volta_ch1_water_input_temperature
            name: Voda vstup (skutečná)
      - type: markdown
        content: |
          ### 💡 Tipy pro doladění:

          **Je v zimě zima?**
          - ❄️ Termostaty pořád otevřené, teplota nikdy nedosáhne cíle
          - 🔧 **Zvyš Slope** na 0.7 nebo 0.8

          **Je v přechodném období teplo?**
          - 🌤️ Termostaty pořád zavřené, přehřívání
          - 🔧 **Sniž Slope** na 0.5 nebo 0.4

          **Celkově moc/málo topí?**
          - 🔧 Uprav **Offset** (±5°C)
